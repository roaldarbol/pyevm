# pixi.toml — development environment for pyevm
#
# Use this instead of uv when you want GPU-accelerated video decoding via
# torchcodec.  torchcodec has no Windows pip wheels, but conda-forge ships
# Windows CUDA builds.
#
# Install pixi:  https://pixi.sh
# Setup:         pixi install && pixi run lefthook install
# Run CLI:       pixi run pyevm phase input.mp4 output.mp4
# Run tests:     pixi run test

[workspace]
name      = "pyeulervid"
version   = "0.1.0"
channels  = ["conda-forge"]
# Keep in step with pixi-version in .github/workflows (CI pins the same pixi).
requires-pixi = ">=0.82.0"
# CUDA 12.8 is declared only on the GPU platforms (win/linux); macOS is CPU-only.
# Driver 591.86 supports up to CUDA 13.1; toolkit 12.8 is what torch uses.
platforms = [
    { platform = "win-64", cuda = "12.8" },
    { platform = "linux-64", cuda = "12.8" },
    "osx-64",
    "osx-arm64",
]

# ---------------------------------------------------------------------------
# Conda dependencies
# ---------------------------------------------------------------------------

[dependencies]
python = ">=3.11,<3.14"

# conda-forge lags pip by weeks. 2.13 is the newest release it builds for CUDA 12.8
# on Windows; 2.14 is CUDA 13.4 only there.
pytorch = "2.13.*"

# opencv from conda-forge (prebuilt binary) rather than the PyPI
# opencv-python-headless wheel — like torch above, this satisfies the pip requirement so uv skips it.
# opencv-python-headless has no Intel-macOS wheel for recent versions, so the PyPI route
# would compile OpenCV from source on osx-64.
opencv = ">=4.13.0.92"

# torchcodec — CUDA build on win-64/linux-64, CPU build on macOS.
# 0.17 supports pytorch >=2.11.
[target.win-64.dependencies]
torchcodec = { version = "0.17.*", build = "*cuda*" }

[target.linux-64.dependencies]
torchcodec = { version = "0.17.*", build = "*cuda*" }

[target.osx-64.dependencies]
torchcodec = { version = "0.17.*" }  # CPU-only build (Intel)

[target.osx-arm64.dependencies]
torchcodec = { version = "0.17.*" }  # CPU-only build (Apple Silicon)

# ---------------------------------------------------------------------------
# Environments — test matrix across supported Python versions.
# `default` uses 3.13; `py311` and `py312` pin older versions so CI can exercise
# them all.
# ---------------------------------------------------------------------------
[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

# Release builds only need Python and the build frontend, not torch/CUDA.
[feature.build.dependencies]
python = "3.13.*"
python-build = ">=1.0"

[feature.build.tasks]
build = "python -m build"

[environments]
default = ["py313"]
py311 = ["py311"]
py312 = ["py312"]
build = { features = ["build"], no-default-feature = true }

# ---------------------------------------------------------------------------
# PyPI dependencies
# ---------------------------------------------------------------------------
# Everything else is pip-only or works best from PyPI.

[pypi-dependencies]
# Install the project itself in editable mode.
# torch is already satisfied by the conda pytorch package above, so pip
# will skip it when resolving pyeulervid's dependencies.
pyeulervid = { path = ".", editable = true, extras = ["app", "dev", "docs"] }

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------

[tasks]
# Testing
test         = "python -m pytest"
test-cov     = "python -m pytest --cov=pyevm --cov-report=term-missing --cov-report=xml"

# Linting / formatting
lint         = "ruff check src tests"
format       = "ruff format src tests"
format-check = "ruff format --check src tests"
lint-fix     = "ruff check --fix src tests"

# Git hooks
lefthook     = "lefthook"

# Security
# conda-forge's pytorch 2.13 requires setuptools <82, so these two setuptools
# advisories can't be fixed in the lock, and pyevm doesn't use setuptools itself.
# pytorch 2.14 drops the cap, so both ignores can go with it (CUDA 13.4 only on Windows).
audit        = "pip-audit --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-xmj3-9gf7-h52w"

# Docs
docs         = "zensical build"
docs-serve   = "zensical serve"

# CLI shortcut
pyevm        = "python -m pyevm.cli"
