name: Relock

# Refresh pixi.lock on a clean runner. dependabot can't update the conda side
# of the lock, and solving locally is impractical (the editable pyeulervid sdist
# builds inside a cloud-synced folder), so run the update here on manual demand.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to update (space-separated). Leave empty for a full update."
        required: false
        default: "gitpython idna msgpack tornado urllib3 pymdown-extensions pip"

permissions:
  contents: write
  actions: write   # to re-trigger CI on the new lock commit (see final step)

env:
  # Runners have no GPU; fake the CUDA virtual package so the conda-forge CUDA
  # builds of pytorch/torchcodec solve (they run CPU-only here).
  CONDA_OVERRIDE_CUDA: "12.8"

jobs:
  relock:
    name: Update pixi.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.72.0
          run-install: false

      - name: Update lockfile
        run: pixi update ${{ inputs.packages }}

      - name: Commit refreshed lock
        id: commit
        run: |
          if git diff --quiet pixi.lock; then
            echo "pixi.lock already up to date — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixi.lock
          git commit -m "chore: relock pixi.lock (pixi update ${{ inputs.packages }})"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A commit pushed with GITHUB_TOKEN does not trigger CI, so kick it off
      # explicitly to validate the refreshed lock (tests, lint, audit).
      - name: Trigger CI on the new lock
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}"
