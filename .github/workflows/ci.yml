name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual runs, and let the Relock workflow re-validate main after it
  # commits an updated lock (bot commits don't trigger `push` runs on their own).
  workflow_dispatch:

env:
  # GitHub runners have no GPU. Fake the CUDA virtual package so pixi can solve
  # and install the conda-forge CUDA builds of pytorch/torchcodec; they import
  # and run CPU-only for the test suite.
  CONDA_OVERRIDE_CUDA: "12.8"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: py312
            python-version: "3.12"
          - environment: default
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.72.0
          environments: ${{ matrix.environment }}
          cache: true

      - name: Run tests with coverage
        run: pixi run -e ${{ matrix.environment }} test-cov

      - name: Upload coverage to Codecov
        if: matrix.environment == 'default'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.72.0
          environments: default
          cache: true

      - name: Check formatting
        run: pixi run format-check

      - name: Lint
        run: pixi run lint

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.72.0
          environments: default
          cache: true

      - name: Audit dependencies
        run: pixi run audit
