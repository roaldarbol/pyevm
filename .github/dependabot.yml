version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "python"]
    ignore:
      # torch's real version is pinned by conda-forge in pixi.toml and is coupled
      # to torchcodec; bumps must be coordinated there, not via the pip floor.
      - dependency-name: "torch"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # torchcodec is pinned to 0.17.* in pixi.toml, which must support the pinned
      # pytorch; bump it there, not via the pip floor.
      - dependency-name: "torchcodec"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
